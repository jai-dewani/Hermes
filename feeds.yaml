# ntfy.sh topic to publish notifications to.
# The user subscribes to this topic in the ntfy app on their phone.
ntfy_topic: "hermes_blog_notification"

# Optional: ntfy server URL. Defaults to https://ntfy.sh if omitted.
ntfy_server: "https://ntfy.sh"

# Optional: state retention window in days. Defaults to 30 if omitted.
max_age_days: 30

# Optional: enable/disable throwback notifications when no new articles are found.
# Defaults to true. Set to false to disable.
throwback_enabled: true

